# Local dev services for the backend's feature pipeline (plans/ingestion.md §11.3).
# Postgres stays the local Homebrew postgresql@16 (see backend/README.md).
#
#   docker compose up -d          # Qdrant on :6333, Redis on :6379
#   docker compose down           # stop (data persists under backend/data/)

services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./backend/data/qdrant:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./backend/data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
